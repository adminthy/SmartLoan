{% extends 'layout.html' %}
{% block content %}
    <h1>{{title}}</h1>
    <a href="{% url 'add_loan_type' %}" class="btn btn-primary">Add New</a>
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
                <tr>
                    <td>{{ forloop.counter }}</td>
                    <td>{{ row.name }}</td>
                    <td>{{ row.description }}</td>
                    <td>
                        <a href="{% url 'edit_loan_type' row.pk %}" class="btn btn-warning">Edit</a>
                        <a href="{% url 'delete_loan_type' row.pk %}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock content %}
