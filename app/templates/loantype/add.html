{% extends 'layout.html' %}
{% block content %}
    <h1>Create New Loan Type</h1>
    <form method="POST" action="{% url 'save_loan_type' %}">
        {% csrf_token %}
        <label >Loan type Name:</label>
        <input type="text" class="form-control" name="loan-type-name" required>
        <label for="description">Description:</label>
        <textarea class="form-control" name="loan-type-description"></textarea>
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-danger">Cancel</a>
    </form>
{% endblock content %}
