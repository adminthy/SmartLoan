
{% extends 'layout.html' %}
{% block content %}
    <h1>Delete Loan Type</h1>

    <p>Are you sure you want to delete "{{ data.name }}"?</p>

    <form method="POST" action="{% url 'remove_loan_type' data.id %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'loan_type_index' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock content %}
