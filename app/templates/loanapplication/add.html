
{% extends 'layout.html' %}

{% block content %}

<h1>Add Loan</h1>

<form method="POST" action="{% url 'save_loan_application' %}">
    {% csrf_token %}

    <div class="mb-3">
        <label>Ref No</label>
        <input type="text" name="ref_no" class="form-control">
    </div>

    <div class="mb-3">
        <label>Borrower</label>
        <select name="borrower" class="form-control" required>
            <option value="">-- Select Borrower --</option>
            {% for item in borrowers %}
                <option value="{{ item.id }}">{{ item.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Loan Type</label>
        <select name="loan_type" class="form-control">
            <option value="">-- Select Loan Type --</option>
            {% for item in loan_types %}
                <option value="{{ item.id }}">{{ item.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Loan Plan</label>
        <select name="loan_plan" class="form-control" required>
            <option value="">-- Select Loan Plan --</option>
            {% for item in loan_plans %}
                <option value="{{ item.id }}">{{ item.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Purpose</label>
        <textarea name="purpose" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label>Amount</label>
        <input type="number"
               name="amount"
               class="form-control"
               min="0.01"
               step="0.01"
               required>
    </div>

    <div class="mb-3">
        <label>Status</label>
        <select name="status" class="form-control">
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
        </select>
    </div>

    <div class="mb-3">
        <label>Release Date</label>
        <input type="date" name="release_date" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Save</button>

    <a href="{% url 'loan_application_index' %}"
       class="btn btn-secondary">Back</a>

</form>

{% endblock content %}
