
{% extends 'layout.html' %}

{% block content %}

<h1>Delete Loan Application</h1>

<p>Are you sure you want to delete this application?</p>

<p>Borrower: {{ data.borrower.name }}</p>
<p>Loan Plan: {{ data.loan_plan.name }}</p>
<p>Amount: {{ data.amount }}</p>
<p>Status: {{ data.status }}</p>

<form method="POST" action="{% url 'remove_loan_application' data.id %}">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Yes, Delete
    </button>

    <a href="{% url 'loan_application_index' %}"
       class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock content %}
