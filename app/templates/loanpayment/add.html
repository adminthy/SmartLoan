
{% extends 'layout.html' %}

{% block content %}

<h1>Create New Payment</h1>

<form method="POST" action="{% url 'save_loan_payment' %}">
    {% csrf_token %}

    <div class="mb-3">
        <label>Select Loan</label>
        <select name="loan_application" class="form-control" required>
            <option value="">-- Select Loan --</option>
            {% for item in applications %}
            <option value="{{ item.id }}">
                {{ item.ref_no|default:item.id }} - {{ item.borrower.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Payee Name</label>
        <input type="text"
               name="payee_name"
               class="form-control"
               required>
    </div>

    <div class="mb-3">
        <label>Payment Amount</label>
        <input type="number"
               name="payment_amount"
               class="form-control"
               min="0.01"
               step="0.01"
               required>
    </div>

    <div class="mb-3">
        <label>Penalty Amount</label>
        <input type="number"
               name="penalty_amount"
               class="form-control"
               min="0"
               step="0.01"
               value="0"
               required>
    </div>

    <div class="mb-3">
        <label>Overdue</label>
        <select name="overdue" class="form-control" required>
            <option value="No">No</option>
            <option value="Yes">Yes</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Save</button>

    <a href="{% url 'loan_payment_index' %}"
       class="btn btn-danger">Cancel</a>

</form>

{% endblock content %}
