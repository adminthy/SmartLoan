
{% extends 'layout.html' %}

{% block content %}

<div class="container mt-4">
    <h2>Add New User</h2>

    <form method="POST" action="{% url 'save_user' %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text"
                   name="username"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   name="email"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   required>
        </div>

        <button type="submit" class="btn btn-primary">
            Save User
        </button>

        <a href="{% url 'user_index' %}" class="btn btn-secondary">
            Back
        </a>
    </form>
</div>

{% endblock %}
