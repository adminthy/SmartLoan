
{% extends 'layout.html' %}

{% block content %}

<h1>Edit Borrower</h1>

<form method="POST" action="{% url 'update_borrower' data.id %}">
    {% csrf_token %}

    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control"
               value="{{ data.name }}" required>
    </div>

    <div class="mb-3">
        <label>Gender</label>
        <select name="gender" class="form-control" required>
            <option value="Male" {% if data.gender == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if data.gender == "Female" %}selected{% endif %}>Female</option>
        </select>
    </div>

    <div class="mb-3">
        <label>Date of Birth</label>
        <input type="date" name="date_of_birth" class="form-control"
               value="{{ data.date_of_birth|date:'Y-m-d' }}" required>
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input type="text" name="phone" class="form-control"
               value="{{ data.phone }}" required>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ data.email }}">
    </div>

    <div class="mb-3">
        <label>Address</label>
        <textarea name="address" class="form-control" required>{{ data.address }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Update</button>

    <a href="{% url 'borrower_index' %}" class="btn btn-secondary">Back</a>
</form>

{% endblock content %}
