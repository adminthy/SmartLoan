
{% extends 'layout.html' %}

{% block content %}

<h1>Delete Borrower</h1>

<p>Are you sure you want to delete this borrower?</p>

<table class="table table-bordered">
    <tr>
        <th>Name</th>
        <td>{{ data.name }}</td>
    </tr>
    <tr>
        <th>Gender</th>
        <td>{{ data.gender }}</td>
    </tr>
    <tr>
        <th>Phone</th>
        <td>{{ data.phone }}</td>
    </tr>
    <tr>
        <th>Email</th>
        <td>{{ data.email }}</td>
    </tr>
</table>

<form method="POST" action="{% url 'remove_borrower' data.id %}">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Yes, Delete
    </button>

    <a href="{% url 'borrower_index' %}" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock content %}
