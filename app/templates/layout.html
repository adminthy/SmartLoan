
<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>SmartLoan</title>

    <style>
        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
        }

        .navbar-brand i {
            font-size: 25px;
            margin-right: 5px;
        }

        .navbar-nav .nav-link {
            font-weight: 500;
        }

        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">

        <!-- SmartLoan Logo -->
        <a class="navbar-brand" href="{% url 'home' %}">
            <i class="bi bi-bank"></i>
            SmartLoan
        </a>

        <!-- Mobile Menu Button -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Menu -->
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

            <div class="navbar-nav">

                <a class="nav-link" href="{% url 'home' %}">
                    Home
                </a>

                <a class="nav-link" href="{% url 'loan_type_index' %}">
                    Loan Type
                </a>

                <a class="nav-link" href="{% url 'loan_plan_index' %}">
                    Loan Plan
                </a>

                <a class="nav-link" href="{% url 'borrower_index' %}">
                    Borrower
                </a>

                <a class="nav-link" href="{% url 'loan_application_index' %}">
                    Loan Application
                </a>

                <a class="nav-link" href="{% url 'loan_payment_index' %}">
                    Loan Payment
                </a>

                <a class="nav-link" href="{% url 'loan_repayment_schedule_index' %}">
                    Loan Repayment Schedule
                </a>

            </div>

            <!-- User Login / Logout -->
            <div class="navbar-nav ms-auto">

                {% if request.user.is_authenticated %}

                    <span class="nav-link text-white">
                        Welcome, {{ request.user.username }}
                    </span>

                    <a class="nav-link text-white"
                       href="{% url 'logout' %}">
                        <i class="bi bi-box-arrow-right"></i>
                        Logout
                    </a>

                {% else %}

                    <a class="nav-link text-white"
                       href="{% url 'login' %}">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Login
                    </a>

                {% endif %}

            </div>

        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid mt-3">

    {% block content %}
    {% endblock content %}

</div>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous">
</script>

</body>
</html>
